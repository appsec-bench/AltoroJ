name: SonarQube Cloud Scan

on:
  push:
    branches:
      - AltoroJ-3.2
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonar:
    name: SonarQube Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=appsec-bench_AltoroJ
            -Dsonar.organization=appsec-bench
            -Dsonar.sources=src,WebContent
            -Dsonar.verbose=true
